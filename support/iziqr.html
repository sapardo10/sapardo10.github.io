<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte - iziQR</title>
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-accent: #1565C0;
            --app-accent-2: #0D1B2A;
            --app-accent-soft: rgba(21, 101, 192, 0.14);
        }
    </style>
</head>
<body>
    <div class="stars-background"></div>

    <div id="site-nav"></div>

    <section class="page-section">
        <div class="container">
            <div class="support-card">
                <div class="app-card-head">
                    <img src="../assets/images/apps/iziqr.png" alt="iziQR" class="app-icon-img">
                    <h3 style="margin:0;"><span class="lang" data-es="Soporte de iziQR" data-en="iziQR Support"></span></h3>
                </div>
                <p class="lang" data-es="¿Tienes problemas escaneando o guardando códigos QR? Aquí encontrarás respuestas a las preguntas más comunes." data-en="Having trouble scanning or saving QR codes? Find answers to the most common questions below."></p>
            </div>

            <h2 class="section-title" style="margin-top:3rem;"><span class="lang" data-es="Preguntas frecuentes" data-en="Frequently asked questions"></span></h2>

            <div style="max-width:760px;margin:2rem auto 0;">
                <div class="faq-item">
                    <h3 class="lang" data-es="¿Necesito crear una cuenta?" data-en="Do I need to create an account?"></h3>
                    <p class="lang" data-es="No. iziQR no tiene cuentas ni inicio de sesión. Abre la app y empieza a escanear al instante." data-en="No. iziQR has no accounts or login. Open the app and start scanning right away."></p>
                </div>
                <div class="faq-item">
                    <h3 class="lang" data-es="¿Por qué la app pide permiso de cámara?" data-en="Why does the app ask for camera permission?"></h3>
                    <p class="lang" data-es="La cámara es necesaria para leer los códigos QR. Solo se activa en la pantalla de escaneo y no se guarda ni transmite ninguna imagen." data-en="The camera is required to read QR codes. It's only active on the scanner screen, and no images are saved or transmitted."></p>
                </div>
                <div class="faq-item">
                    <h3 class="lang" data-es="¿Dónde se guarda mi historial de escaneos?" data-en="Where is my scan history stored?"></h3>
                    <p class="lang" data-es="Únicamente en tu dispositivo. No se sincroniza ni se sube a ningún servidor." data-en="Only on your device. It is never synced or uploaded to any server."></p>
                </div>
                <div class="faq-item">
                    <h3 class="lang" data-es="¿Cómo borro mi historial?" data-en="How do I clear my history?"></h3>
                    <p class="lang" data-es="Desde la pestaña de Historial puedes eliminar escaneos individuales o borrar todo el historial. También puedes desinstalar la app para eliminar todos los datos." data-en="From the History tab you can delete individual scans or clear the whole history. You can also uninstall the app to remove all data."></p>
                </div>
                <div class="faq-item">
                    <h3 class="lang" data-es="El escáner no detecta el código, ¿qué hago?" data-en="The scanner isn't detecting my code, what do I do?"></h3>
                    <p class="lang" data-es="Asegúrate de tener buena iluminación y de que el código QR esté enfocado y completo dentro del recuadro de la cámara." data-en="Make sure you have good lighting and that the QR code is in focus and fully visible inside the camera frame."></p>
                </div>
            </div>

            <div class="support-card" style="max-width:760px;margin:3rem auto 0;text-align:center;">
                <h3 class="lang" data-es="¿Aún necesitas ayuda?" data-en="Still need help?"></h3>
                <p class="lang" data-es="Escríbenos y te responderemos lo antes posible." data-en="Write to us and we'll get back to you as soon as possible."></p>
                <a href="mailto:carnifis+iziqr@gmail.com" class="email-link" style="margin-top:0.5rem;">
                    <span class="email-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg></span>
                    <span class="email-text lang" data-es="Contáctanos" data-en="Contact us"></span>
                </a>
            </div>

            <p style="text-align:center;margin-top:2.5rem;">
                <a href="../apps/iziqr.html" class="lang" data-es="← Volver a iziQR" data-en="← Back to iziQR"></a>
                &nbsp;·&nbsp;
                <a href="../privacy/iziqr.html" class="lang" data-es="Privacidad" data-en="Privacy"></a>
                &nbsp;·&nbsp;
                <a href="../terms/iziqr.html" class="lang" data-es="Términos" data-en="Terms"></a>
            </p>
        </div>
    </section>

    <div id="site-footer"></div>

    <script src="../script.js"></script>
</body>
</html>
