<body>
    <div class="stars-background"></div>

    <div id="site-nav"></div>

    <section class="page-section">
        <div class="container">
            <div class="support-card">
                <div class="app-card-head">
                    <img src="../assets/images/apps/stemstudio.png" alt="StemStudio" class="app-icon-img">
                    <h3 style="margin:0;"><span class="lang" data-es="Soporte de StemStudio" data-en="StemStudio Support"></span></h3>
                </div>
                <p class="lang" data-es="¿Problemas al separar o exportar canciones? Aquí encontrarás respuestas a las preguntas más comunes." data-en="Having trouble separating or exporting songs? Find answers to the most common questions below."></p>
            </div>

            <h2 class="section-title" style="margin-top:3rem;"><span class="lang" data-es="Preguntas frecuentes" data-en="Frequently asked questions"></span></h2>

            <div style="max-width:760px;margin:2rem auto 0;">
                <div class="faq-item">
                    <h3 class="lang" data-es="¿Cuánto pesan los modelos y cómo se descargan?" data-en="How big are the models and how do they download?"></h3>
                    <p class="lang" data-es="La primera vez la app descarga los modelos de separación desde Hugging Face; ocupan entre unos 80 y 300 MB según el modelo. Te recomendamos usar Wi-Fi. Se descargan una sola vez y después la app funciona sin conexión." data-en="On first use the app downloads the separation models from Hugging Face; they are roughly 80 to 300 MB depending on the model. We recommend Wi-Fi. It&#x27;s a one-time download, and afterwards the app works offline."></p>
                </div>
                <div class="faq-item">
                    <h3 class="lang" data-es="La app se cierra o va lenta en mi teléfono, ¿qué hago?" data-en="The app crashes or is slow on my phone, what can I do?"></h3>
                    <p class="lang" data-es="La separación usa mucha memoria. En teléfonos con poca RAM cierra otras apps, prueba el modelo de 4 pistas (más ligero) o un preset de calidad más bajo, y procesa canciones más cortas." data-en="Separation uses a lot of memory. On low-RAM phones, close other apps, try the lighter 4-stem model or a lower quality preset, and process shorter songs."></p>
                </div>
                <div class="faq-item">
                    <h3 class="lang" data-es="¿Cuánto tarda en separarse una canción?" data-en="How long does separation take?"></h3>
                    <p class="lang" data-es="En un teléfono reciente, una canción de 3 minutos tarda aproximadamente lo mismo que dura la canción; en equipos más antiguos o con poca memoria, más. Conecta el teléfono al cargador para trabajos largos. Puedes seguir usando el teléfono: el proceso continúa en segundo plano con una notificación de progreso (Android)." data-en="On a recent phone, a 3-minute song takes about as long as the song itself; older or low-memory devices take longer. Plug in your phone for long jobs. You can keep using your phone: processing continues in the background with a progress notification (Android)."></p>
                </div>
                <div class="faq-item">
                    <h3 class="lang" data-es="¿Dónde se guardan mis exportaciones?" data-en="Where do my exports go?"></h3>
                    <p class="lang" data-es="Las pistas o mezclas que exportas (WAV o M4A) se guardan en tu dispositivo y puedes compartirlas desde la hoja nativa de compartir. Nada se sube a nuestros servidores." data-en="Stems or mixes you export (WAV or M4A) are saved on your device and can be shared from the native share sheet. Nothing is uploaded to our servers."></p>
                </div>
                <div class="faq-item">
                    <h3 class="lang" data-es="¿Cómo cambio mis opciones de anuncios y privacidad?" data-en="How do I change my ad and privacy choices?"></h3>
                    <p class="lang" data-es="En Ajustes puedes revisar y cambiar tu consentimiento de anuncios (donde la ley lo exige se te pide al inicio)." data-en="In Settings you can review and change your ad consent (where the law requires it, you are asked on first launch)."></p>
                </div>
                <div class="faq-item">
                    <h3 class="lang" data-es="¿Cómo desactivo la analítica?" data-en="How do I turn off analytics?"></h3>
                    <p class="lang" data-es="En Ajustes desactiva las estadísticas de uso anónimas y los informes de fallos. Nunca incluyen títulos de canciones, nombres de archivo ni audio." data-en="In Settings, switch off anonymous usage statistics and crash reports. They never include song titles, file names or audio."></p>
                </div>
                <div class="faq-item">
                    <h3 class="lang" data-es="¿Necesito una cuenta?" data-en="Do I need an account?"></h3>
                    <p class="lang" data-es="No. StemStudio no tiene cuentas ni inicio de sesión." data-en="No. StemStudio has no accounts or login."></p>
                </div>
                <div class="faq-item">
                    <h3 class="lang" data-es="¿Puedo usar cualquier canción?" data-en="Can I use any song?"></h3>
                    <p class="lang" data-es="Usa música que poseas o tengas derecho a procesar. Las pistas exportadas siguen sujetas a los derechos de la grabación original." data-en="Use music you own or have the right to process. Exported stems remain subject to the rights in the original recording."></p>
                </div>
            </div>

            <div class="support-card" style="max-width:760px;margin:3rem auto 0;text-align:center;">
                <h3 class="lang" data-es="¿Aún necesitas ayuda?" data-en="Still need help?"></h3>
                <p class="lang" data-es="Escríbenos y te responderemos lo antes posible." data-en="Write to us and we'll get back to you as soon as possible."></p>
                <a href="mailto:carnifis+stemstudio@gmail.com" class="email-link" style="margin-top:0.5rem;">
                    <span class="email-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg></span>
                    <span class="email-text lang" data-es="Contáctanos" data-en="Contact us"></span>
                </a>
            </div>

                &nbsp;·&nbsp;
                <a href="../terms/stemstudio.html" class="lang" data-es="Términos" data-en="Terms"></a>
            </p>
        </div>
    </section>
