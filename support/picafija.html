<body>
    <div class="stars-background"></div>

    <div id="site-nav"></div>

    <section class="page-section">
        <div class="container">
            <div class="support-card">
                <div class="app-card-head">
                    <img src="../assets/images/apps/picafija.png" alt="Picafija" class="app-icon-img">
                    <h3 style="margin:0;"><span class="lang" data-es="Soporte de Picafija" data-en="Picafija Support"></span></h3>
                </div>
                <p class="lang" data-es="¿Necesitas ayuda con tu partida de Picas y Fijas? Aquí encontrarás respuestas a las preguntas más comunes." data-en="Need help with your Picas y Fijas match? Find answers to the most common questions below."></p>
            </div>

            <h2 class="section-title" style="margin-top:3rem;"><span class="lang" data-es="Preguntas frecuentes" data-en="Frequently asked questions"></span></h2>

            <div style="max-width:760px;margin:2rem auto 0;">
                <div class="faq-item">
                    <h3 class="lang" data-es="No logro conectar por Bluetooth, ¿qué hago?" data-en="I can't connect over Bluetooth, what do I do?"></h3>
                    <p class="lang" data-es="Verifica que el Bluetooth esté encendido en ambos teléfonos y que Picafija tenga los permisos de Bluetooth (y de ubicación en Android antiguo, necesarios solo para poder buscar dispositivos cercanos) concedidos en los ajustes del sistema." data-en="Make sure Bluetooth is turned on on both phones and that Picafija has Bluetooth permissions (and location permission on older Android, needed only to scan for nearby devices) granted in your system settings."></p>
                </div>
                <div class="faq-item">
                    <h3 class="lang" data-es="¿Cómo juego contra otra persona?" data-en="How do I play against another person?"></h3>
                    <p class="lang" data-es="Un teléfono crea la partida y el otro la busca y se une por Bluetooth. Ambos deben estar cerca uno del otro y con el Bluetooth activado." data-en="One phone hosts the match and the other searches for it and joins over Bluetooth. Both phones need to be near each other with Bluetooth turned on."></p>
                </div>
                <div class="faq-item">
                    <h3 class="lang" data-es="¿Cómo juego sin conexión contra la IA?" data-en="How do I play offline against the AI?"></h3>
                    <p class="lang" data-es="Elige el modo un jugador y selecciona un nivel de dificultad: básico, medio o difícil. No necesitas internet ni otro jugador." data-en="Choose single-player mode and pick a difficulty level: basic, medium or hard. You don't need internet or another player."></p>
                </div>
                <div class="faq-item">
                    <h3 class="lang" data-es="¿Necesito internet o crear una cuenta?" data-en="Do I need internet or an account?"></h3>
                    <p class="lang" data-es="No. Picafija funciona completamente sin conexión, sin cuentas y sin servidores. El multijugador se juega directamente entre dos teléfonos por Bluetooth." data-en="No. Picafija works entirely offline, with no accounts and no servers. Multiplayer is played directly between two phones over Bluetooth."></p>
                </div>
                <div class="faq-item">
                    <h3 class="lang" data-es="¿Qué significan 'picas' y 'fijas'?" data-en="What do 'picas' and 'fijas' mean?"></h3>
                    <p class="lang" data-es="Una fija es un dígito acertado en la posición correcta; una pica es un dígito correcto pero en la posición equivocada. El primero en conseguir 4 fijas gana la partida." data-en="A fija is a digit guessed in the right position; a pica is a correct digit in the wrong position. The first player to get 4 fijas wins the match."></p>
                </div>
            </div>

            <div class="support-card" style="max-width:760px;margin:3rem auto 0;text-align:center;">
                <h3 class="lang" data-es="¿Aún necesitas ayuda?" data-en="Still need help?"></h3>
                <p class="lang" data-es="Escríbenos y te responderemos lo antes posible." data-en="Write to us and we'll get back to you as soon as possible."></p>
                <a href="mailto:carnifis+picafija@gmail.com" class="email-link" style="margin-top:0.5rem;">
                    <span class="email-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg></span>
                    <span class="email-text lang" data-es="Contáctanos" data-en="Contact us"></span>
                </a>
            </div>

            <p style="text-align:center;margin-top:2.5rem;">
                <a href="../apps/picafija.html" class="lang" data-es="← Volver a Picafija" data-en="← Back to Picafija"></a>
                &nbsp;·&nbsp;
                <a href="../privacy/picafija.html" class="lang" data-es="Privacidad" data-en="Privacy"></a>
            </p>
        </div>
    </section>

    <div id="site-footer"></div>
