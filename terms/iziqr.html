            <p class="lang" data-es="iziQR (“Escáner QR fácil: escanea, guarda y comparte”) es una app de escaneo de códigos QR. Te permite escanear códigos con la cámara de tu dispositivo, ver y guardar el historial localmente, y compartir o abrir el contenido encontrado (URLs, correos, números de teléfono)." data-en="iziQR (“Easy QR scanner — scan, save, share”) is a QR code scanner application. It lets you scan QR codes using your device's camera, view and save scan history locally on your device, and share or open the content found in QR codes (such as URLs, email addresses, and phone numbers)."></p>
