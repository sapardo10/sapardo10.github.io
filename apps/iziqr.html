<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iziQR - Escáner QR fácil</title>
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-accent: #1565C0;
            --app-accent-2: #0D1B2A;
            --app-accent-soft: rgba(21, 101, 192, 0.14);
        }
    </style>
</head>
<body>
    <div class="stars-background"></div>

    <div id="site-nav"></div>

    <header class="app-detail-hero">
        <div class="container">
            <div class="detail-hero-art">
                <img src="../assets/images/apps/iziqr.png" alt="iziQR" class="detail-hero-icon">
            </div>
            <div class="detail-hero-text">
                <span class="eyebrow lang" data-es="Utilidades" data-en="Utilities"></span>
                <h1>iziQR</h1>
                <p class="lead lang" data-es="Escáner QR fácil: escanea, guarda y comparte." data-en="Easy QR scanner — scan, save, share."></p>
                <div class="detail-hero-actions">
                    <span class="coming-soon-badge lang" data-es="Próximamente" data-en="Coming soon"></span>
                </div>
            </div>
        </div>
    </header>

    <section class="page-section">
        <div class="container">
            <h2 class="section-title lang" data-es="Qué hace" data-en="What it does"></h2>
            <p class="section-subtitle lang" data-es="Una app de escaneo de códigos QR rápida y privada: sin cuentas, sin anuncios y sin rastreo — todo tu historial se queda en tu dispositivo." data-en="A fast, private QR code scanner: no accounts, no ads, no tracking — your whole history stays on your device."></p>

            <div class="feature-list">
                <div class="feature-item">
                    <div class="feature-icon">📷</div>
                    <h3 class="lang" data-es="Escaneo instantáneo" data-en="Instant scanning"></h3>
                    <p class="lang" data-es="Apunta la cámara y detecta el código al instante, sin pasos extra." data-en="Point the camera and detect the code instantly, no extra steps."></p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🗂️</div>
                    <h3 class="lang" data-es="Historial local" data-en="Local history"></h3>
                    <p class="lang" data-es="Todos tus escaneos se guardan solo en tu dispositivo, para consultarlos cuando quieras." data-en="Every scan is saved locally on your device, ready whenever you need it."></p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🔗</div>
                    <h3 class="lang" data-es="Reconoce cualquier tipo" data-en="Recognizes any type"></h3>
                    <p class="lang" data-es="URLs, correos, teléfonos, Wi-Fi, ubicaciones y texto — cada tipo con su propia acción." data-en="URLs, emails, phone numbers, Wi-Fi, locations and plain text — each with its own action."></p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📤</div>
                    <h3 class="lang" data-es="Comparte en un toque" data-en="Share in one tap"></h3>
                    <p class="lang" data-es="Comparte o abre el contenido escaneado directamente desde la hoja nativa de tu dispositivo." data-en="Share or open scanned content directly from your device's native share sheet."></p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🔒</div>
                    <h3 class="lang" data-es="100% privado" data-en="100% private"></h3>
                    <p class="lang" data-es="Sin cuentas, sin anuncios y sin analítica de terceros — nada sale de tu dispositivo." data-en="No accounts, no ads, and no third-party analytics — nothing ever leaves your device."></p>
                </div>
            </div>

            <div class="detail-hero-actions" style="justify-content:center;margin-top:3rem;">
                <a href="../support/iziqr.html" class="btn btn-primary lang" data-es="Soporte" data-en="Support"></a>
                <a href="../privacy/iziqr.html" class="btn btn-secondary lang" data-es="Privacidad" data-en="Privacy"></a>
                <a href="../terms/iziqr.html" class="btn btn-secondary lang" data-es="Términos" data-en="Terms"></a>
            </div>
            <p style="text-align:center;margin-top:2rem;">
                <a href="../index.html" class="lang" data-es="← Volver" data-en="← Back"></a>
            </p>

    <div id="site-footer"></div>

    <script src="../script.js"></script>
