<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StemStudio - Separador de pistas con IA</title>
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-accent: #8B5CF6;
            --app-accent-2: #6D28D9;
            --app-accent-soft: rgba(139, 92, 246, 0.14);
        }
    </style>
</head>
<body>
    <div class="stars-background"></div>

    <div id="site-nav"></div>

    <header class="app-detail-hero">
        <div class="container">
            <div class="detail-hero-art">
                <img src="../assets/images/apps/stemstudio.png" alt="StemStudio" class="detail-hero-icon">
            </div>
            <div class="detail-hero-text">
                <span class="eyebrow lang" data-es="Música y audio" data-en="Music &amp; Audio"></span>
                <h1>StemStudio</h1>
                <p class="lead lang" data-es="Separa canciones en voz, batería, bajo, guitarra y piano, con IA en tu dispositivo." data-en="Split songs into vocals, drums, bass, guitar and piano, with on-device AI."></p>
                <div class="detail-hero-actions">
                    <span class="coming-soon-badge lang" data-es="Próximamente" data-en="Coming soon"></span>
                </div>
            </div>
        </div>
    </header>

    <section class="page-section">
        <div class="container">
            <h2 class="section-title lang" data-es="Qué hace" data-en="What it does"></h2>
            <p class="section-subtitle lang" data-es="Un separador de pistas con IA que corre por completo en tu dispositivo: crea karaokes, pistas de acompañamiento o aísla un instrumento." data-en="An AI stem splitter that runs entirely on your device: make karaoke tracks, backing tracks or isolate an instrument."></p>

            <div class="feature-list">
                <div class="feature-item">
                    <div class="feature-icon">🎛️</div>
                    <h3 class="lang" data-es="Separación en el dispositivo" data-en="On-device separation"></h3>
                    <p class="lang" data-es="Demucs v4 (ONNX Runtime) separa voz, batería, bajo, guitarra, piano y otros directamente en tu teléfono. Tu música nunca se sube." data-en="Demucs v4 (ONNX Runtime) splits vocals, drums, bass, guitar, piano and other right on your phone. Your music is never uploaded."></p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🎚️</div>
                    <h3 class="lang" data-es="Mezclador por pista" data-en="Per-stem mixer"></h3>
                    <p class="lang" data-es="Volumen, silencio, solo y ecualizador para cada pista, todas sincronizadas." data-en="Volume, mute, solo and EQ for each stem, all playing in sync."></p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">💾</div>
                    <h3 class="lang" data-es="Exporta y comparte" data-en="Export and share"></h3>
                    <p class="lang" data-es="Exporta pistas sueltas o tu mezcla final en WAV o M4A y compártelas desde la app." data-en="Export single stems or your finished mix as WAV or M4A and share them from the app."></p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📴</div>
                    <h3 class="lang" data-es="Funciona sin conexión" data-en="Works offline"></h3>
                    <p class="lang" data-es="Los modelos se descargan una sola vez; después StemStudio funciona sin internet." data-en="Models are downloaded once; after that StemStudio works without internet."></p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🔒</div>
                    <h3 class="lang" data-es="Sin cuenta y privado" data-en="No account, private"></h3>
                    <p class="lang" data-es="Sin registro. Las estadísticas anónimas y los informes de fallos se pueden desactivar en Ajustes." data-en="No sign-up. Anonymous statistics and crash reports can be switched off in Settings."></p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🆓</div>
                    <h3 class="lang" data-es="Gratis con anuncios" data-en="Free with ads"></h3>
                    <p class="lang" data-es="Separaciones y exportaciones ilimitadas, con un banner y un anuncio ocasional. Consentimiento donde la ley lo exige." data-en="Unlimited separations and exports, with a banner and an occasional ad. Consent asked where the law requires it."></p>
                </div>
            </div>

            <div class="detail-hero-actions" style="justify-content:center;margin-top:3rem;">
                <a href="../support/stemstudio.html" class="btn btn-primary lang" data-es="Soporte" data-en="Support"></a>
                <a href="../privacy/stemstudio.html" class="btn btn-secondary lang" data-es="Privacidad" data-en="Privacy"></a>
                <a href="../terms/stemstudio.html" class="btn btn-secondary lang" data-es="Términos" data-en="Terms"></a>
            </div>
            <p style="text-align:center;margin-top:2rem;">
                <a href="../index.html" class="lang" data-es="← Volver" data-en="← Back"></a>
            </p>
        </div>
    </section>

    <div id="site-footer"></div>

    <script src="../script.js"></script>
</body>
</html>
