<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picafija - Picas y Fijas por Bluetooth</title>
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-accent: #6C4FE8;
            --app-accent-2: #14123B;
            --app-accent-soft: rgba(108, 79, 232, 0.16);
        }
    </style>
</head>
<body>
    <div class="stars-background"></div>

    <div id="site-nav"></div>

    <header class="app-detail-hero">
        <div class="container">
            <div class="detail-hero-art">
                <img src="../assets/images/apps/picafija.png" alt="Picafija" class="detail-hero-icon">
            </div>
            <div class="detail-hero-text">
                <span class="eyebrow lang" data-es="Juegos" data-en="Games"></span>
                <h1>Picafija</h1>
                <p class="lead lang" data-es="El clásico juego colombiano de Picas y Fijas, ahora por Bluetooth: reta a otro jugador cerca de ti, sin internet ni cuentas." data-en="The classic Colombian Picas y Fijas game, now over Bluetooth: challenge a nearby player with no internet and no accounts."></p>
                <div class="detail-hero-actions">
                    <span class="coming-soon-badge lang" data-es="Próximamente" data-en="Coming soon"></span>
                </div>
            </div>
        </div>
    </header>

    <section class="page-section">
        <div class="container">
            <h2 class="section-title lang" data-es="Qué hace" data-en="What it does"></h2>
            <p class="section-subtitle lang" data-es="Cada jugador elige un número secreto de 4 dígitos y por turnos intenta adivinar el del otro. Cada intento revela cuántos dígitos están en la posición correcta (fijas) y cuántos existen pero en otra posición (picas). El primero en lograr 4 fijas gana." data-en="Each player picks a secret 4-digit number and takes turns guessing the other's. Every guess reveals how many digits are in the right spot (fijas) and how many exist but in the wrong spot (picas). First to get 4 fijas wins."></p>

            <div class="feature-list">
                <div class="feature-item">
                    <div class="feature-icon">🔵</div>
                    <h3 class="lang" data-es="Multijugador local por Bluetooth" data-en="Local Bluetooth multiplayer"></h3>
                    <p class="lang" data-es="Un teléfono crea la partida y el otro se une por Bluetooth de baja energía (BLE), totalmente sin conexión." data-en="One phone hosts the game and the other joins over Bluetooth Low Energy (BLE), fully offline."></p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🤖</div>
                    <h3 class="lang" data-es="Modo un jugador contra la IA" data-en="Single-player vs AI"></h3>
                    <p class="lang" data-es="Tres niveles de dificultad: básico (aleatorio), medio (deducción consistente) y difícil (minimax)." data-en="Three difficulty levels: basic (random), medium (consistent deduction) and hard (minimax)."></p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🔒</div>
                    <h3 class="lang" data-es="Sin internet ni cuentas" data-en="No internet, no accounts"></h3>
                    <p class="lang" data-es="No se necesita servidor, conexión a internet ni registro. Juega directamente entre dos teléfonos." data-en="No server, internet connection or sign-up needed. Play directly between two phones."></p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🎯</div>
                    <h3 class="lang" data-es="Picas y fijas por turnos" data-en="Turn-based picas & fijas"></h3>
                    <p class="lang" data-es="Sistema de puntuación fiel al juego tradicional: fijas por posición correcta, picas por dígito correcto en otra posición." data-en="Scoring stays true to the traditional game: fijas for the right digit in the right spot, picas for a right digit in the wrong spot."></p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🇨🇴</div>
                    <h3 class="lang" data-es="Interfaz en español" data-en="Spanish interface"></h3>
                    <p class="lang" data-es="Toda la app está pensada y escrita en español, fiel al juego tradicional colombiano." data-en="The whole app is designed and written in Spanish, true to the traditional Colombian game."></p>
                </div>
            </div>

            <div class="detail-hero-actions" style="justify-content:center;margin-top:3rem;">
                <a href="../support/picafija.html" class="btn btn-primary lang" data-es="Soporte" data-en="Support"></a>
                <a href="../privacy/picafija.html" class="btn btn-secondary lang" data-es="Privacidad" data-en="Privacy"></a>
            </div>
            <p style="text-align:center;margin-top:2rem;">
                <a href="../index.html" class="lang" data-es="← Volver" data-en="← Back"></a>
            </p>
        </div>
    </section>

    <div id="site-footer"></div>

    <script src="../script.js"></script>
</body>
</html>
