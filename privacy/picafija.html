    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-accent: #6C4FE8;
            --app-accent-2: #14123B;
            --app-accent-soft: rgba(108, 79, 232, 0.16);
        }
        .policy { max-width: 780px; margin: 0 auto; }
        .policy h2 { font-size: 1.4rem; font-weight: 700; margin: 2.25rem 0 0.6rem; color: var(--text-dark); }
        .policy p { color: var(--text-mid); margin-bottom: 0.9rem; }
        .policy ul { color: var(--text-mid); margin: 0 0 0.9rem 1.4rem; }
        .policy li { margin-bottom: 0.4rem; }
        .policy .updated { color: var(--text-light); font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="stars-background"></div>

    <div id="site-nav"></div>

    <section class="page-section">
        <div class="container policy">
            <div class="app-card-head">
                <img src="../assets/images/apps/picafija.png" alt="Picafija" class="app-icon-img">
                <h1 style="font-size:2rem;font-weight:800;letter-spacing:-0.02em;margin:0;"><span class="lang" data-es="Política de Privacidad de Picafija" data-en="Picafija Privacy Policy"></span></h1>
            </div>

            <p class="lang" style="margin-top:1.25rem;" data-es="Picafija está diseñado para no recopilar ningún dato personal. Esta política explica, en detalle, qué información se intercambia mientras juegas y por qué no llega a ningún servidor." data-en="Picafija is designed to collect no personal data at all. This policy explains, in detail, what information is exchanged while you play and why none of it reaches any server."></p>
            <p class="updated lang" data-es="Última actualización: 30 de julio de 2026" data-en="Last updated: July 30, 2026"></p>

            <h2 class="lang" data-es="Información que recopilamos" data-en="Information we collect"></h2>
            <p class="lang" data-es="Ninguna. Picafija no recopila ni almacena datos personales, ni te pide crear una cuenta. Los únicos datos que existen durante una partida son tu número secreto y tus intentos de adivinar, y viven únicamente en la memoria de tu teléfono mientras juegas." data-en="None. Picafija does not collect or store personal data, and it never asks you to create an account. The only data that exists during a match is your secret number and your guesses, and it lives only in your phone's memory while you play."></p>

            <h2 class="lang" data-es="Servicios de terceros" data-en="Third-party services"></h2>
            <p class="lang" data-es="Picafija no utiliza ningún servicio de terceros: no hay analíticas, no hay informes de fallos, no hay anuncios y no hay SDKs externos que transmitan información. La app no tiene backend ni servidor propio." data-en="Picafija does not use any third-party service: no analytics, no crash reporting, no ads, and no external SDKs that transmit information. The app has no backend or server of its own."></p>

            <h2 class="lang" data-es="Cómo usamos los datos" data-en="How we use data"></h2>
            <p class="lang" data-es="Para jugar una partida en modo multijugador, tu número secreto y tus intentos se envían directamente al teléfono de la otra persona mediante Bluetooth de baja energía (BLE), de dispositivo a dispositivo y sin pasar por internet ni por ningún servidor. En Android, la app solicita permisos de Bluetooth y, en versiones anteriores a Android 12, permisos de ubicación exigidos por el sistema operativo para poder escanear dispositivos BLE cercanos; esa ubicación nunca se lee, se guarda ni se usa para ningún otro fin." data-en="To play a multiplayer match, your secret number and your guesses are sent directly to the other player's phone over Bluetooth Low Energy (BLE), device-to-device, without going through the internet or any server. On Android, the app requests Bluetooth permissions and, on versions before Android 12, location permissions required by the operating system to scan for nearby BLE devices; that location is never read, stored, or used for any other purpose."></p>

            <h2 class="lang" data-es="Retención" data-en="Retention"></h2>
            <p class="lang" data-es="No conservamos ningún dato de tus partidas. Los números y los intentos existen solo mientras la partida está en curso y desaparecen al cerrar la app o terminar el juego." data-en="We do not retain any data from your matches. Numbers and guesses exist only while a match is in progress and are gone once you close the app or the game ends."></p>

            <h2 class="lang" data-es="Tus derechos" data-en="Your rights"></h2>
            <p class="lang" data-es="Como no recopilamos ni almacenamos ningún dato personal, no hay datos que solicitar, corregir o eliminar. Si tienes cualquier duda sobre cómo funciona la app, escríbenos al contacto indicado abajo." data-en="Since we don't collect or store any personal data, there is no data to request, correct or delete. If you have any questions about how the app works, contact us below."></p>

            <h2 class="lang" data-es="Contacto" data-en="Contact"></h2>
            <p class="lang" data-es="Para cualquier pregunta sobre esta política, escríbenos a:" data-en="For any questions about this policy, write to us at:"></p>
            <p><a href="mailto:carnifis+picafija@gmail.com">carnifis+picafija@gmail.com</a></p>

            <p style="text-align:center;margin-top:2.5rem;">
                <a href="../apps/picafija.html" class="lang" data-es="← Volver a Picafija" data-en="← Back to Picafija"></a>
                &nbsp;·&nbsp;
                <a href="../support/picafija.html" class="lang" data-es="Soporte" data-en="Support"></a>
            </p>
        </div>
    </section>

    <div id="site-footer"></div>
