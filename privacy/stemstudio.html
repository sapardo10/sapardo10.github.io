<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Política de privacidad de StemStudio.">
    <meta name="theme-color" content="#8B5CF6">
    <title>Privacidad · StemStudio</title>
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-accent: #8B5CF6;
            --app-accent-2: #6D28D9;
            --app-accent-soft: rgba(139, 92, 246, 0.14);
        }
        .legal { max-width: 760px; margin: 0 auto; }
        .legal h2 { font-size: 1.4rem; font-weight: 700; margin: 2.2rem 0 0.6rem; color: var(--text-dark); }
        .legal p, .legal li { color: var(--text-mid); margin-bottom: 0.8rem; }
        .legal ul { padding-left: 1.4rem; margin-bottom: 0.8rem; }
        .legal .updated { color: var(--text-light); font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="stars-background"></div>

    <!-- Shared navbar injected by script.js -->
    <div id="site-nav"></div>

    <section class="page-section">
        <div class="container">
            <div class="legal">
                <div class="app-card-head" style="margin-bottom:1.5rem;">
                    <img src="../assets/images/apps/stemstudio.png" alt="StemStudio" class="app-icon-img">
                    <h1 class="app-name lang" data-es="Política de Privacidad — StemStudio" data-en="Privacy Policy — StemStudio"></h1>
                </div>
                <p class="lang" data-es="Esta política describe cómo StemStudio trata tu información. StemStudio separa tus canciones en pistas (voz, batería, bajo y más) directamente en tu dispositivo." data-en="This policy describes how StemStudio handles your information. StemStudio splits your songs into stems (vocals, drums, bass and more) directly on your device."></p>
                <p class="updated lang" data-es="Última actualización: 3 de noviembre de 2026" data-en="Last updated: November 3, 2026"></p>
                <h2 class="lang" data-es="Tu música" data-en="Your music"></h2>
                <p class="lang" data-es="Las canciones que importas, las pistas separadas y tus mezclas se procesan y guardan solo en tu dispositivo. Nunca se suben a nuestros servidores ni a terceros. Solo salen del dispositivo si tú las exportas o compartes." data-en="Songs you import, the separated stems and your mixes are processed and stored only on your device. They are never uploaded to our servers or to third parties. They leave the device only when you export or share them."></p>
                <h2 class="lang" data-es="Información que recopilamos" data-en="Information we collect"></h2>
                <p class="lang" data-es="La app descarga sus modelos de separación desde Hugging Face. Con tu permiso puede recopilar métricas de uso anónimas (por ejemplo, qué modelo usaste y cuánto tardó la separación) y reportes de fallos. Estas métricas nunca incluyen títulos, nombres de archivo ni el contenido de tu música. Puedes desactivarlas en Ajustes." data-en="The app downloads its separation models from Hugging Face. With your permission it may collect anonymous usage metrics (for example, which model you used and how long a separation took) and crash reports. These metrics never include titles, file names or the content of your music. You can turn them off in Settings."></p>
                <h2 class="lang" data-es="Publicidad" data-en="Advertising"></h2>
                <p class="lang" data-es="StemStudio es gratuita y se financia con anuncios de Google AdMob. AdMob puede usar identificadores del dispositivo y datos de uso para mostrar y medir anuncios, y, si lo autorizas, para personalizarlos. En la Unión Europea, el Reino Unido, Suiza y algunos estados de EE. UU. te pedimos tu consentimiento antes, y puedes cambiarlo en Ajustes → Privacidad y anuncios." data-en="StemStudio is free and funded by ads from Google AdMob. AdMob may use device identifiers and usage data to show and measure ads and, if you allow it, to personalise them. In the EU, UK, Switzerland and some US states we ask for your consent first, and you can change it in Settings → Privacy & ad choices."></p>
                <h2 class="lang" data-es="Servicios de terceros" data-en="Third-party services"></h2>
                <p class="lang" data-es="Google AdMob (anuncios), Firebase Analytics (métricas de uso) y Firebase Crashlytics (reportes de fallos), de Google; y Hugging Face (descarga de modelos). Cada uno trata los datos según su propia política de privacidad. No vendemos información personal." data-en="Google AdMob (ads), Firebase Analytics (usage metrics) and Firebase Crashlytics (crash reports), all by Google; and Hugging Face (model downloads). Each processes data under its own privacy policy. We do not sell personal information."></p>
                <h2 class="lang" data-es="Retención" data-en="Retention"></h2>
                <p class="lang" data-es="Tus canciones y pistas permanecen en tu dispositivo hasta que las elimines o desinstales la app. Las métricas y reportes de fallos se conservan según las políticas de Google." data-en="Your songs and stems remain on your device until you delete them or uninstall the app. Metrics and crash reports are retained according to Google's policies."></p>
                <h2 class="lang" data-es="Tus derechos" data-en="Your rights"></h2>
                <p class="lang" data-es="Puedes borrar tus proyectos en la app, desactivar las métricas, cambiar tu consentimiento de anuncios y pedirnos información sobre tus datos escribiéndonos al correo de contacto." data-en="You can delete your projects in the app, turn off metrics, change your ad consent, and ask us about your data by emailing the contact address below."></p>
                <h2 class="lang" data-es="Contacto" data-en="Contact"></h2>
                <p class="lang" data-es="Para cualquier pregunta sobre privacidad, escríbenos a:" data-en="For any privacy questions, contact us at:"></p>
                <p><a href="mailto:carnifis+stemstudio@gmail.com">carnifis+stemstudio@gmail.com</a></p>

                <div class="detail-hero-actions" style="justify-content:center;margin-top:2.5rem;">
                    <a href="../index.html" class="btn btn-secondary lang" data-es="← Inicio" data-en="← Home"></a>
                </div>
            </div>
        </div>
    </section>

    <!-- Shared footer injected by script.js -->
    <div id="site-footer"></div>

    <script src="../script.js"></script>
</body>
</html>
