<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacidad - Bitácora</title>
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-accent: #C8643C;
            --app-accent-2: #2B1B12;
            --app-accent-soft: rgba(200, 100, 60, 0.16);
        }
        .policy { max-width: 780px; margin: 0 auto; }
        .policy h2 { font-size: 1.4rem; font-weight: 700; margin: 2.25rem 0 0.6rem; color: var(--text-dark); }
        .policy p { color: var(--text-mid); margin-bottom: 0.9rem; }
        .policy ul { color: var(--text-mid); margin: 0 0 0.9rem 1.4rem; }
        .policy li { margin-bottom: 0.4rem; }
        .policy .updated { color: var(--text-light); font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="stars-background"></div>

    <div id="site-nav"></div>

    <section class="page-section">
        <div class="container policy">
            <div class="app-card-head">
                <img src="../assets/images/apps/bitacora.png" alt="Bitácora" class="app-icon-img">
                <h1 style="font-size:2rem;font-weight:800;letter-spacing:-0.02em;margin:0;"><span class="lang" data-es="Política de Privacidad de Bitácora" data-en="Bitácora Privacy Policy"></span></h1>
            </div>

            <p class="lang" data-es="Bitácora es una herramienta personal de Sergio Pardo (@seranpardos). No es un servicio público y no tiene usuarios externos: solo procesa los videos y las cuentas de su propio autor." data-en="Bitácora is a personal tool by Sergio Pardo (@seranpardos). It is not a public service and has no outside users: it only processes its own author's videos and accounts." style="margin-top:1.25rem;"></p>
            <p class="updated lang" data-es="Última actualización: 4 de noviembre de 2026" data-en="Last updated: November 4, 2026"></p>

            <h2 class="lang" data-es="Qué datos maneja" data-en="What data it handles"></h2>
            <p class="lang" data-es="La herramienta solo maneja material propio: videos de viaje grabados por Sergio y su propia cuenta de TikTok e Instagram. No recopila datos de otras personas ni de visitantes." data-en="The tool only handles the owner's own material: travel videos recorded by Sergio and his own TikTok and Instagram accounts. It does not collect data from other people or visitors."></p>

            <h2 class="lang" data-es="Procesamiento local" data-en="Local processing"></h2>
            <p class="lang" data-es="Los videos se procesan localmente en el Mac del autor. Solo el video final, aprobado manualmente, se envía a TikTok o Instagram mediante sus APIs oficiales." data-en="Videos are processed locally on the author's Mac. Only the final, manually approved video is sent to TikTok or Instagram through their official APIs."></p>

            <h2 class="lang" data-es="Autorización y credenciales" data-en="Authorization and credentials"></h2>
            <p class="lang" data-es="Las credenciales de autorización (OAuth) se usan únicamente para subir contenido a la cuenta del propio autor, se guardan de forma local y se revocan tras su uso." data-en="Authorization (OAuth) credentials are used only to upload to the author's own account, are stored locally, and are revoked after use."></p>

            <h2 class="lang" data-es="Voz sintetizada con IA" data-en="AI-synthesized voice"></h2>
            <p class="lang" data-es="La narración puede usar un clon de IA de la propia voz del autor. Los videos publicados lo indican como contenido generado con IA." data-en="The voiceover may use an AI clone of the author's own voice. Published videos are labelled as AI-generated content."></p>

            <h2 class="lang" data-es="Terceros y venta de datos" data-en="Third parties and data sales"></h2>
            <p class="lang" data-es="No se venden ni se comparten datos con terceros, salvo el envío del video final a TikTok e Instagram descrito arriba. No hay analíticas ni rastreo." data-en="No data is sold or shared with third parties, apart from sending the final video to TikTok and Instagram as described above. There is no analytics or tracking."></p>

            <h2 class="lang" data-es="Contacto" data-en="Contact"></h2>
            <p class="lang" data-es="Para cualquier pregunta, escríbeme a:" data-en="For any questions, write to me at:"></p>
            <p><a href="mailto:carnifis+bitacora@gmail.com">carnifis+bitacora@gmail.com</a></p>

            <p style="text-align:center;margin-top:2.5rem;">

                &nbsp;·&nbsp;
                <a href="../terms/bitacora.html" class="lang" data-es="Términos" data-en="Terms"></a>
                &nbsp;·&nbsp;
                <a href="../support/bitacora.html" class="lang" data-es="Soporte" data-en="Support"></a>
            </p>
        </div>
    </section>

    <div id="site-footer"></div>

    <script src="../script.js"></script>
</body>
</html>
