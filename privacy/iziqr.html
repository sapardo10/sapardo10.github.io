<body>
    <div class="stars-background"></div>

    <div id="site-nav"></div>

    <section class="page-section">
        <div class="container policy">
            <div class="app-card-head">
                <img src="../assets/images/apps/iziqr.png" alt="iziQR" class="app-icon-img">
                <h1 style="font-size:2rem;font-weight:800;letter-spacing:-0.02em;margin:0;"><span class="lang" data-es="Política de Privacidad de iziQR" data-en="iziQR Privacy Policy"></span></h1>
            </div>

            <p class="lang" style="margin-top:1.25rem;" data-es="Esta política describe qué información recopila iziQR, cómo se usa y tus derechos al respecto. La app es operada por Sergio Pardo, desarrollador individual con sede en la República de Colombia." data-en="This policy describes what information iziQR collects, how it is used, and your rights regarding it. The app is operated by Sergio Pardo, an individual developer based in the Republic of Colombia."></p>
            <p class="updated lang" data-es="Última actualización: 24 de mayo de 2026" data-en="Last updated: May 24, 2026"></p>

            <h2 class="lang" data-es="Qué recopilamos" data-en="What we collect"></h2>
            <p class="lang" data-es="Guardado localmente en tu dispositivo: el historial de escaneos (los valores de los códigos QR y la fecha/hora de cada escaneo) y tus preferencias de la app (como el idioma). Estos datos nunca salen de tu dispositivo y no podemos acceder a ellos." data-en="Stored locally on your device: your scan history (the raw QR code values and the date/time of each scan) and your app preferences (such as your chosen language). This data never leaves your device and cannot be accessed by us."></p>
            <p class="lang" data-es="No recopilamos tu nombre, correo electrónico ni ninguna información de cuenta — la app no tiene cuentas ni inicio de sesión. No transmitimos tu historial de escaneos ni el contenido de los códigos QR a ningún servidor. No usamos GPS ni accedemos a la ubicación. No usamos SDKs de publicidad ni de analítica/rastreo de errores. No vendemos tus datos ni los sincronizamos en la nube." data-en="We do not collect your name, email, or any account information — the app has no accounts or login. We do not transmit your scan history or QR code content to any server. We do not use GPS or access location services. We do not use advertising or analytics/crash-tracking SDKs. We do not sell your data or sync it to the cloud."></p>

            <h2 class="lang" data-es="Permiso de cámara" data-en="Camera permission"></h2>
            <p class="lang" data-es="iziQR necesita acceso a la cámara únicamente para escanear códigos QR. La cámara solo se activa en la pantalla de escaneo. No se almacenan, transmiten ni procesan imágenes o fotogramas más allá de la detección en el propio dispositivo necesaria para escanear. Puedes revocar el permiso en cualquier momento desde los ajustes de tu dispositivo; si lo haces, el escáner dejará de funcionar." data-en="iziQR requires camera access solely to scan QR codes. The camera is activated only on the scanner screen. No images or video frames are stored, transmitted, or processed beyond the on-device detection needed to scan. You can revoke the permission at any time in your device settings; doing so will prevent the scanner from working."></p>

            <h2 class="lang" data-es="Cómo usamos tu información" data-en="How we use your information"></h2>
            <p class="lang" data-es="No procesamos tu información personal en nuestros servidores porque no la recopilamos. Todos los datos (historial de escaneos, preferencias) viven exclusivamente en tu dispositivo y se usan únicamente para ofrecerte las funciones de la app." data-en="We do not process your personal information on our servers because we do not collect it. All data (scan history, preferences) lives exclusively on your device and is used only to provide the app's features to you."></p>

            <h2 class="lang" data-es="Servicios de terceros" data-en="Third-party services"></h2>
            <p class="lang" data-es="iziQR no integra ningún SDK de analítica, publicidad o recopilación de datos de terceros. Cuando eliges abrir una URL, iniciar una llamada o redactar un correo desde un código QR escaneado, el sistema operativo de tu dispositivo o la app correspondiente (navegador, marcador, cliente de correo) se encarga de esa acción, y esas apps tienen sus propias políticas de privacidad que no controlamos. Al usar la función de compartir, el contenido se pasa a la hoja de compartir nativa de tu dispositivo." data-en="iziQR does not integrate any third-party analytics, advertising, or data-collection SDKs. When you choose to open a URL, place a call, or compose an email from a scanned QR code, your device's OS or the relevant app (browser, dialer, email client) handles that action, and those apps have their own privacy policies which we do not control. When you use the share feature, content is passed to your device's native share sheet."></p>

            <h2 class="lang" data-es="Retención de datos" data-en="Data retention"></h2>
            <p class="lang" data-es="No operamos servidores que almacenen tus datos personales. Todos los datos que retiene iziQR viven únicamente en tu dispositivo. Puedes borrar tu historial de escaneos desde la app en cualquier momento, o eliminar todos los datos desinstalando la app." data-en="We do not operate servers that store your personal data. All data retained by iziQR lives on your device only. You can delete your scan history from within the app at any time, or remove all app data by uninstalling it."></p>

            <h2 class="lang" data-es="Privacidad de menores" data-en="Children's privacy"></h2>
            <p class="lang" data-es="iziQR no está dirigida a menores de 13 años. No recopilamos conscientemente información personal de menores. Si crees que un menor ha usado la app de una forma que genera una preocupación de privacidad, contáctanos." data-en="iziQR is not directed to children under 13. We do not knowingly collect personal information from children. If you believe a child has used the app in a way that raises a privacy concern, please contact us."></p>

            <h2 class="lang" data-es="Seguridad" data-en="Security"></h2>
            <p class="lang" data-es="Como todos los datos se almacenan localmente en tu dispositivo, la seguridad de tu historial de escaneos depende de las funciones de seguridad de tu propio dispositivo (bloqueo de pantalla, cifrado, etc.). No transmitimos datos por red, así que no hay datos en tránsito que proteger de nuestro lado." data-en="Because all data is stored locally on your device, the security of your scan history is governed by your device's own security features (screen lock, encryption, etc.). We do not transmit any data over the network, so there is no data in transit to protect on our end."></p>

            <h2 class="lang" data-es="Tus derechos" data-en="Your rights"></h2>
            <p class="lang" data-es="Usuarios en Colombia (Ley 1581 de 2012): tienes derecho a conocer, actualizar, corregir y eliminar los datos personales que tengamos sobre ti. Como no almacenamos datos personales en nuestros servidores, todos los datos pueden eliminarse borrando el historial en la app o desinstalándola." data-en="Colombian users (Ley 1581 de 2012): you have the right to know, update, correct, and delete personal data we hold about you. Because we do not store personal data on our own servers, all data can be deleted by clearing scan history in the app or by uninstalling it."></p>
            <p class="lang" data-es="Usuarios en la Unión Europea (RGPD): tienes derechos de acceso, rectificación, supresión, limitación del tratamiento y portabilidad de tus datos personales, y a oponerte a su tratamiento. Como iziQR no procesa datos personales en nuestros servidores, estos derechos pueden ejercerse normalmente desde tu propio dispositivo." data-en="European Union users (GDPR): you have rights to access, rectify, erase, restrict processing, and port your personal data, and to object to its processing. Because iziQR processes no personal data on our servers, these rights can typically be exercised directly on your device."></p>
            <p class="lang" data-es="Usuarios en California (CCPA): tienes derecho a saber qué información personal se recopila, a eliminarla y a optar por no venderla. No vendemos información personal. Los datos mínimos que manejamos (historial de escaneos y preferencias) se almacenan solo en tu dispositivo." data-en="California users (CCPA): you have the right to know what personal information is collected, the right to delete it, and the right to opt out of its sale. We do not sell personal information. The minimal data we handle (scan history and preferences) is stored only on your device."></p>

            <h2 class="lang" data-es="Cambios a esta política" data-en="Changes to this policy"></h2>
            <p class="lang" data-es="Podemos actualizar esta Política de Privacidad periódicamente. La fecha de “Última actualización” refleja los cambios. El uso continuado de la app tras los cambios constituye tu aceptación de la política actualizada." data-en="We may update this Privacy Policy from time to time. The “Last updated” date reflects when changes were made. Continued use of the app after changes constitutes acceptance of the updated policy."></p>

            <h2 class="lang" data-es="Contacto" data-en="Contact"></h2>
            <p class="lang" data-es="Para cualquier pregunta o solicitud sobre esta Política de Privacidad, escríbenos a:" data-en="For any questions or requests about this Privacy Policy, write to us at:"></p>

        </div>
